name: warehouse

networks:
  warehouse_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:

services:
  postgres:
    image: postgres:17-alpine
    container_name: warehouse-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - warehouse_network

  redis:
    image: redis:7-alpine
    container_name: warehouse-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - warehouse_network

  backend:
    image: warehouse-backend:dev
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: warehouse-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      PORT: "1323"
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "1323:1323"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1323/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - warehouse_network

  frontend:
    image: warehouse-frontend:dev
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: warehouse-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:1323/api/v1}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - warehouse_network

  design:
    profiles: [dev]
    image: nginx:alpine
    container_name: warehouse-design
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "8080:80"
    volumes:
      - ../design:/usr/share/nginx/html:ro
    networks:
      - warehouse_network

  nginx-ui:
    profiles: [dev]
    image: uozi/nginx-ui:latest
    container_name: warehouse-nginx-ui
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_UI_PORT:-9000}:9000"
    volumes:
      - ./nginx:/etc/nginx
      - ./nginx-ui:/etc/nginx-ui
    depends_on:
      - backend
      - frontend
      - design
    networks:
      - warehouse_network

  pgadmin:
    profiles: [dev]
    image: dpage/pgadmin4
    container_name: warehouse-pgadmin
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - warehouse_network

  redis-commander:
    profiles: [dev]
    image: rediscommander/redis-commander:latest
    container_name: warehouse-redis-commander
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - warehouse_network
