# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# Do not activate --profile dev (excludes nginx-ui, design, pgAdmin, redis-commander).
# mem_limit: sized for a ~2GiB host that already runs other stacks.

services:
  postgres:
    ports: !reset []
    mem_limit: 256m
    command: postgres -c shared_buffers=64MB -c max_connections=40

  redis:
    ports: !reset []
    mem_limit: 64m
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru

  minio:
    mem_limit: 192m
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"

  minio-init:
    mem_limit: 64m

  backend:
    image: warehouse-backend:prod
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    ports: !reset []
    volumes: !reset []
    mem_limit: 192m
    # Distroless image has no curl; base compose healthcheck does not apply.
    healthcheck:
      disable: true
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      PORT: "1323"
      APP_ENV: production
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-jwt-secret-min-32-chars}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-warehouse-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      # Prod: set to https://<public-host> (nginx proxies /{bucket}/ → minio). Avoid http://IP:port (mixed content).
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9002}

  frontend:
    image: warehouse-frontend:prod
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    ports: !reset []
    volumes: !reset []
    mem_limit: 320m
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      NEXT_PUBLIC_API_URL: /api/v1
      # Server-side BFF → Go (must be absolute; relative /api/v1 fails in Node fetch)
      API_INTERNAL_URL: http://backend:1323/api
      NODE_OPTIONS: --max-old-space-size=256
    command: ["bun", "run", "start", "--", "-H", "0.0.0.0"]

  nginx:
    image: nginx:alpine
    container_name: warehouse-nginx
    restart: unless-stopped
    mem_limit: 32m
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - warehouse_network
