<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warehouse — Product form</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      (function () {
        var key = "warehouse-design-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body data-perm-module="product" data-perm-type="product_list">
    <div id="app-shell"></div>

    <script src="../js/i18n/th.js"></script>
    <script src="../js/i18n/en.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/seed/website_language.js"></script>
    <script src="../js/seed/_admin_shared.js"></script>
    <script src="../js/seed/admin_menu.js"></script>
    <script src="../js/seed/admin_menu_language.js"></script>
    <script src="../js/seed/admin_permission.js"></script>
    <script src="../js/seed/admin_menu_permission.js"></script>
    <script src="../js/seed/admin_role.js"></script>
    <script src="../js/seed/admin_role_language.js"></script>
    <script src="../js/seed/admin_role_permission.js"></script>
    <script src="../js/seed/admin_user.js"></script>
    <script src="../js/seed/index.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/layout.js"></script>
    <script>
      (function () {
        global.store.init();
        global.i18n.init();
        if (!global.auth.requireAuth("login.html")) return;
        if (!global.permissions.guardPage("product", "product_list", "login.html")) return;
        global.layout.mount({
          pageTitle: global.i18n.t("page.productListForm"),
          contentHtml:
            '<div class="crud-page"><p class="crud-page-header__desc" data-i18n="page.comingSoon"></p>' +
            '<p><a class="btn" href="product-list.html" data-i18n="crud.back"></a></p></div>',
        });
        global.i18n.init();
      })();
    </script>
  </body>
</html>
