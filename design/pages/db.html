<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warehouse — DB Browser</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      (function () {
        var key = "warehouse-design-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body class="db-browser-page">
    <div id="db-root"></div>

    <script src="../js/seed/website_language.js"></script>
    <script src="../js/seed/_admin_shared.js"></script>
    <script src="../js/seed/website_country.js"></script>
    <script src="../js/seed/website_country_language.js"></script>
    <script src="../js/seed/website_province.js"></script>
    <script src="../js/seed/website_province_language.js"></script>
    <script src="../js/seed/website_district.js"></script>
    <script src="../js/seed/website_district_language.js"></script>
    <script src="../js/seed/website_sub_district.js"></script>
    <script src="../js/seed/website_sub_district_language.js"></script>
    <script src="../js/seed/admin_menu.js"></script>
    <script src="../js/seed/admin_menu_language.js"></script>
    <script src="../js/seed/admin_permission.js"></script>
    <script src="../js/seed/admin_menu_permission.js"></script>
    <script src="../js/seed/admin_role.js"></script>
    <script src="../js/seed/admin_role_language.js"></script>
    <script src="../js/seed/admin_role_permission.js"></script>
    <script src="../js/seed/admin_user.js"></script>
    <script src="../js/seed/setting_bank.js"></script>
    <script src="../js/seed/setting_bank_language.js"></script>
    <script src="../js/seed/setting_vat.js"></script>
    <script src="../js/seed/setting_payment_method.js"></script>
    <script src="../js/seed/setting_payment_method_language.js"></script>
    <script src="../js/seed/setting_sale_channel.js"></script>
    <script src="../js/seed/setting_sale_channel_language.js"></script>
    <script src="../js/seed/setting_code.js"></script>
    <script src="../js/seed/setting_claim_reason.js"></script>
    <script src="../js/seed/setting_claim_reason_language.js"></script>
    <script src="../js/seed/setting_prefix.js"></script>
    <script src="../js/seed/setting_prefix_language.js"></script>
    <script src="../js/seed/supplier_user.js"></script>
    <script src="../js/seed/supplier_information.js"></script>
    <script src="../js/seed/supplier_contact.js"></script>
    <script src="../js/seed/supplier_bank.js"></script>
    <script src="../js/seed/index.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/i18n/th.js"></script>
    <script src="../js/i18n/en.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/schema-tables.js"></script>
    <script src="../js/db-viewer.js"></script>
    <script src="../js/components/dev-bar.js"></script>
    <script>
      (function () {
        store.init();
        dbViewer.mount(document.getElementById("db-root"));
        if (window.i18n) i18n.init();

        devBar.mount({
          toasts: [
            { type: "success", label: "Success: saved", msg: "Operation completed successfully." },
            { type: "error", label: "Error: failed", msg: "Something went wrong. Please try again." },
          ],
          actions: [
            {
              label: "Reset store",
              fn: function () { store.reset(); window.location.reload(); },
            },
          ],
        });
      })();
    </script>
  </body>
</html>
