<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warehouse — Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      (function () {
        var key = "warehouse-design-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body class="login-page">
    <header class="login-toolbar">
      <div class="login-toolbar__actions">
        <button type="button" class="login-toolbar__btn" id="btn-lang" aria-label="ภาษา">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 8 6 6" />
            <path d="m4 14 6-6 2-3" />
            <path d="M2 5h12" />
            <path d="M7 2h1" />
            <path d="m22 22-5-10-5 10" />
            <path d="M14 18h6" />
          </svg>
        </button>
        <button type="button" class="login-toolbar__btn" id="btn-theme" aria-label="สลับธีม"></button>
      </div>
    </header>

    <div class="login-shell">
      <aside class="login-brand">
        <img
          class="login-brand__icon"
          src="../assets/icons/warehouse.svg"
          alt=""
          width="48"
          height="48"
        />
        <span class="login-brand__name" data-i18n="app.name">Warehouse</span>
        <p class="login-brand__tagline" data-i18n="login.description">
          ระบบจัดการคลังสินค้า Warehouse
        </p>
      </aside>

      <div class="login-card">
        <div class="login-card__header">
          <img
            class="login-card__logo"
            src="../assets/icons/warehouse.svg"
            alt=""
            width="40"
            height="40"
          />
          <h1 class="login-card__title" data-i18n="login.title">เข้าสู่ระบบ</h1>
          <p class="login-card__desc" data-i18n="login.description">
            ระบบจัดการคลังสินค้า Warehouse
          </p>
        </div>

        <p class="login-card__error" id="login-error" hidden></p>

        <form id="login-form" novalidate>
          <div class="form-field" id="username-field">
            <label for="username">
              <span data-i18n="login.username">ชื่อผู้ใช้</span>
              <span class="form-field__required" aria-hidden="true">*</span>
            </label>
            <div class="form-field__control">
              <span class="form-field__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="5" />
                  <path d="M20 21a8 8 0 0 0-16 0" />
                </svg>
              </span>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                data-i18n-placeholder-input="login.username"
                placeholder="กรุณากรอกชื่อผู้ใช้"
              />
            </div>
            <div class="form-field__error-slot" aria-live="polite">
              <p class="form-field__error" id="username-error" hidden role="alert"></p>
            </div>
          </div>

          <div class="form-field" id="password-field">
            <label for="password">
              <span data-i18n="login.password">รหัสผ่าน</span>
              <span class="form-field__required" aria-hidden="true">*</span>
            </label>
            <div class="form-field__control">
              <span class="form-field__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  data-i18n-placeholder-input="login.password"
                  placeholder="กรุณากรอกรหัสผ่าน"
                />
                <button
                  type="button"
                  class="password-field__toggle"
                  aria-label="แสดงรหัสผ่าน"
                ></button>
              </div>
            </div>
            <div class="form-field__error-slot" aria-live="polite">
              <p class="form-field__error" id="password-error" hidden role="alert"></p>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn--primary login-card__submit"
            id="login-submit"
            data-i18n="login.submit"
          >
            เข้าสู่ระบบ
          </button>
        </form>
      </div>
    </div>

    <script src="../js/i18n/th.js"></script>
    <script src="../js/i18n/en.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/seed/website_language.js"></script>
    <script src="../js/seed/_admin_shared.js"></script>
    <script src="../js/seed/website_country.js"></script>
    <script src="../js/seed/website_country_language.js"></script>
    <script src="../js/seed/website_province.js"></script>
    <script src="../js/seed/website_province_language.js"></script>
    <script src="../js/seed/website_district.js"></script>
    <script src="../js/seed/website_district_language.js"></script>
    <script src="../js/seed/website_sub_district.js"></script>
    <script src="../js/seed/website_sub_district_language.js"></script>
    <script src="../js/seed/admin_menu.js"></script>
    <script src="../js/seed/admin_menu_language.js"></script>
    <script src="../js/seed/admin_permission.js"></script>
    <script src="../js/seed/admin_menu_permission.js"></script>
    <script src="../js/seed/admin_role.js"></script>
    <script src="../js/seed/admin_role_language.js"></script>
    <script src="../js/seed/admin_role_permission.js"></script>
    <script src="../js/seed/admin_user.js"></script>
    <script src="../js/seed/index.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/password-toggle.js"></script>
    <script src="../js/components/dev-bar.js"></script>
    <script>
      (function () {
        var THEME_KEY = "warehouse-design-theme";

        store.init();
        i18n.init();

        var form = document.getElementById("login-form");
        var errorEl = document.getElementById("login-error");
        var submitBtn = document.getElementById("login-submit");
        var usernameInput = document.getElementById("username");
        var passwordInput = document.getElementById("password");
        var usernameError = document.getElementById("username-error");
        var passwordError = document.getElementById("password-error");

        passwordToggle.bind(form);

        var SUN_ICON =
          '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
        var MOON_ICON =
          '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

        function getTheme() {
          return document.documentElement.getAttribute("data-theme") || "light";
        }

        function setTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem(THEME_KEY, theme);
          syncThemeIcon();
        }

        function syncThemeIcon() {
          document.getElementById("btn-theme").innerHTML =
            getTheme() === "dark" ? SUN_ICON : MOON_ICON;
        }

        function syncToolbarLabels() {
          document.getElementById("btn-lang").setAttribute("aria-label", i18n.t("lang.toggle"));
          document.getElementById("btn-theme").setAttribute("aria-label", i18n.t("theme.toggle"));
        }

        syncThemeIcon();
        syncToolbarLabels();
        document.addEventListener("i18n:change", syncToolbarLabels);

        document.getElementById("btn-theme").addEventListener("click", function () {
          setTheme(getTheme() === "dark" ? "light" : "dark");
        });

        document.getElementById("btn-lang").addEventListener("click", function () {
          i18n.setLocale(i18n.getLocale() === "th" ? "en" : "th");
          passwordToggle.bind(form);
        });

        function showFieldError(el, msg) {
          el.textContent = msg;
          el.hidden = false;
          var field = el.closest(".form-field");
          if (field) field.classList.add("form-field--invalid");
        }

        function clearFieldError(el) {
          el.textContent = "";
          el.hidden = true;
          var field = el.closest(".form-field");
          if (field) field.classList.remove("form-field--invalid");
        }

        function validateRequired() {
          var valid = true;
          var firstInvalid = null;
          var requiredMsg = i18n.t("error.required");

          if (!usernameInput.value.trim()) {
            showFieldError(usernameError, requiredMsg);
            if (!firstInvalid) firstInvalid = usernameInput;
            valid = false;
          } else {
            clearFieldError(usernameError);
          }

          if (!passwordInput.value) {
            showFieldError(passwordError, requiredMsg);
            if (!firstInvalid) firstInvalid = passwordInput;
            valid = false;
          } else {
            clearFieldError(passwordError);
          }

          if (firstInvalid) firstInvalid.focus();
          return valid;
        }

        usernameInput.addEventListener("input", function () {
          clearFieldError(usernameError);
        });
        passwordInput.addEventListener("input", function () {
          clearFieldError(passwordError);
        });
        usernameInput.addEventListener("blur", function () {
          if (!usernameInput.value.trim()) {
            showFieldError(usernameError, i18n.t("error.required"));
          }
        });
        passwordInput.addEventListener("blur", function () {
          if (!passwordInput.value) {
            showFieldError(passwordError, i18n.t("error.required"));
          }
        });

        if (store.getAll("admin_user").length === 0) {
          errorEl.textContent = i18n.t("login.error.seedMissing");
          errorEl.hidden = false;
        }

        if (auth.redirectIfAuthed()) return;

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          errorEl.hidden = true;

          if (!validateRequired()) return;

          submitBtn.disabled = true;

          var username = usernameInput.value.trim();
          var password = passwordInput.value;
          var result = auth.login(username, password);

          if (!result.ok) {
            errorEl.textContent = i18n.t("login.error.invalid");
            errorEl.hidden = false;
            submitBtn.disabled = false;
            return;
          }

          var landing = auth.resolveLandingPath();
          if (!landing) {
            auth.logout();
            errorEl.textContent = i18n.t("login.error.noMenu");
            errorEl.hidden = false;
            submitBtn.disabled = false;
            return;
          }

          window.location.replace(landing);
        });

        function finishLogin(result) {
          if (!result.ok) return false;
          var landing = auth.resolveLandingPath();
          if (!landing) {
            auth.logout();
            errorEl.textContent = i18n.t("login.error.noMenu");
            errorEl.hidden = false;
            return false;
          }
          window.location.replace(landing);
          return true;
        }

        var users = store.getAll("admin_user").filter(function (u) {
          return u.deleted_at == null && u.status === "active";
        });
        devBar.mount({
          toasts: [
            { type: "error", label: "Error: invalid", msgKey: "login.error.invalid" },
            { type: "error", label: "Error: forbidden", msgKey: "error.forbidden" },
          ],
          actions: users.map(function (u) {
            return {
              label: u.username + " (" + u.type + ")",
              fn: function () {
                errorEl.hidden = true;
                clearFieldError(usernameError);
                clearFieldError(passwordError);
                finishLogin(auth.login(u.username, u._demo_password));
              },
            };
          }),
        });
      })();
    </script>
  </body>
</html>
