<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warehouse</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        var key = "warehouse-design-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-header__title" data-i18n="app.name">Warehouse</h1>
      <div class="app-header__actions">
        <button type="button" class="btn" id="btn-lang" data-i18n="lang.toggle">
          ภาษา
        </button>
        <button type="button" class="btn btn--primary" id="btn-theme" data-i18n="theme.toggle">
          สลับธีม
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="hello">
        <h2 class="hello__title" data-i18n="hello.title">สวัสดีชาวโลก</h2>
        <p class="hello__subtitle" data-i18n="hello.subtitle">
          ต้นแบบ Warehouse พร้อมแล้ว
        </p>
      </section>
    </main>

    <script src="js/i18n/th.js"></script>
    <script src="js/i18n/en.js"></script>
    <script src="js/i18n/i18n.js"></script>
    <script src="js/seed/index.js"></script>
    <script src="js/store.js"></script>
    <script src="js/realtime.js"></script>
    <script>
      (function () {
        var THEME_KEY = "warehouse-design-theme";

        function getTheme() {
          return document.documentElement.getAttribute("data-theme") || "light";
        }

        function setTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem(THEME_KEY, theme);
        }

        store.init();
        i18n.init();

        document.getElementById("btn-theme").addEventListener("click", function () {
          setTheme(getTheme() === "dark" ? "light" : "dark");
        });

        document.getElementById("btn-lang").addEventListener("click", function () {
          i18n.setLocale(i18n.getLocale() === "th" ? "en" : "th");
        });
      })();
    </script>
  </body>
</html>
