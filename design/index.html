<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warehouse Design</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        var key = "warehouse-design-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body class="login-page">
    <div class="hub-card">
      <h1 class="hub-card__title">Warehouse Design</h1>
      <p class="hub-card__desc">เลือกหน้าที่ต้องการเปิด</p>
      <nav class="hub-menu" aria-label="Design pages">
        <div class="hub-menu__item">
          <a href="pages/login.html" class="btn btn--primary hub-menu__link">Login</a>
        </div>
        <div class="hub-menu__item">
          <a href="pages/db.html" class="btn hub-menu__link">DB</a>
        </div>
      </nav>
    </div>
  </body>
</html>
